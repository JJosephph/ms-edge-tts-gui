name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 生成版本信息
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/APP_VERSION = .*/APP_VERSION = \"$VERSION\"/" app.py

      - name: PyInstaller 打包（目录版 → dist/HuayingxiongTTS/HuayingxiongTTS.exe）
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name HuayingxiongTTS --icon assets/app.ico --collect-all tkinterdnd2 --hidden-import docx --hidden-import pypdf --hidden-import miniaudio --hidden-import lameenc --hidden-import cffi --hidden-import _cffi_backend app.py

      - name: PyInstaller 打包（便携单文件版）
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name HuayingxiongTTS-Portable --icon assets/app.ico --collect-all tkinterdnd2 --hidden-import docx --hidden-import pypdf --hidden-import miniaudio --hidden-import lameenc --hidden-import cffi --hidden-import _cffi_backend app.py

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 编译安装程序
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "=== dist 目录内容 ==="
          Get-ChildItem dist -Recurse | Select-Object FullName

          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $iscc) {
            Write-Error "Inno Setup compiler not found!"
            exit 1
          }

          Write-Host "Using ISCC: $iscc"

          $issPath = Join-Path $env:GITHUB_WORKSPACE "installer\HuayingxiongTTS.iss"
          Write-Host "ISS path: $issPath"
          Write-Host "ISS exists: $(Test-Path $issPath)"

          & $iscc "/DMyAppVersion=$env:APP_VERSION" "$issPath"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC compilation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "=== dist 最终内容 ==="
          Get-ChildItem dist | Select-Object Name, Length

      - name: 提取当前版本更新说明
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          $content = Get-Content RELEASE_NOTES.md -Raw
          $pattern = "(?ms)^## v$([regex]::Escape($version))\s*\r?\n(.*?)(?=^## v|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $body = "## v$version`n`n" + $match.Groups[1].Value.Trim()
          } else {
            $body = "Release v$version"
          }
          Set-Content -Path release_body.md -Value $body -Encoding utf8

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            dist/HuayingxiongTTS/HuayingxiongTTS.exe
            dist/HuayingxiongTTS-Portable.exe
            dist/HuayingxiongTTS-Setup.exe
