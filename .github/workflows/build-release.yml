name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 打包（单文件 Portable）
        shell: pwsh
        run: |
          pyinstaller -F -w -n HuayingxiongTTS-Portable `
            --icon assets/app.ico `
            --collect-all tkinterdnd2 `
            --hidden-import docx `
            --hidden-import pypdf `
            --hidden-import miniaudio `
            --hidden-import lameenc `
            --hidden-import cffi `
            --hidden-import _cffi_backend `
            app.py

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 编译安装程序（封装单文件，自动去 v 前缀）
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "ISCC not found"; exit 1 }

          # 去掉 v 前缀（v1.8.0 -> 1.8.0）
          $cleanVer = $env:APP_VERSION -replace '^v', ''

          Write-Host ">>> 编译版本号: $cleanVer (原始 Tag: $env:APP_VERSION)"

          & $iscc "/DMyAppVersion=$cleanVer" "installer\HuayingxiongTTS.iss"

      - name: 生成 Release 说明
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $body = "# 樺英雄语音合成助手 $tag`n`n"
          $body += "## 更新内容`n`n"
          $body += "- 基于 ms-edge-tts-gui v1.7.0 二次构建`n"
          $body += "- 开发者: HuaYingXiong (QQ 562297979)`n"
          $body += "- 仓库: https://github.com/sjhznh/ms-edge-tts-gui`n`n"
          $body += "## 下载说明`n`n"
          $body += "| 文件 | 说明 |`n"
          $body += "|------|------|`n"
          $body += "| `HuayingxiongTTS-Setup.exe` | 安装版（推荐），装完即用 |`n"
          $body += "| `HuayingxiongTTS-Portable.exe` | 单文件便携版，双击直接运行 |`n"
          $body += "`n## 校验`n`n"
          $body += "安装包已内置 Python 运行环境，Windows 10+ 无需额外安装。MIT License 免费开源。`n"
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\release_body.md", $body, [System.Text.Encoding]::UTF8)

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            dist/HuayingxiongTTS-Portable.exe
            dist/HuayingxiongTTS-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
